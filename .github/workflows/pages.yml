name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - editorial-source.tar.gz
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extract Editorial source
        run: |
          mkdir editorial
          tar -xzf editorial-source.tar.gz -C editorial
      - name: Build Editorial portfolio
        working-directory: editorial
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Editorial build
        uses: actions/upload-pages-artifact@v3
        with:
          path: editorial/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
