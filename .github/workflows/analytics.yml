name: Update portfolio analytics

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-analytics
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update analytics snapshot
        run: node scripts/update-analytics.mjs

      - name: Commit snapshot when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- content/analytics.json
          if git diff --cached --quiet; then
            echo "Analytics snapshot did not change."
            exit 0
          fi
          git commit -m "Update portfolio analytics snapshot"
          git push origin main
